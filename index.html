<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Motor App - Admin Protected</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // KONFIGURASI FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBiS743krcarz8ojSb7i54Yrni6N4E5gE8",
            authDomain: "service-motor-app.firebaseapp.com",
            databaseURL: "https://service-motor-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "service-motor-app",
            storageBucket: "service-motor-app.firebasestorage.app",
            messagingSenderId: "303245984126",
            appId: "1:303245984126:web:2ef9e08baf6ebed15c332f",
            measurementId: "G-LJCGMSNDJG"
        };

        // ADMIN PASSWORD - Ganti dengan password yang Anda inginkan
        const ADMIN_PASSWORD = "admin123";

        const SERVICE_TYPES = [
            { name: 'Ganti Oli Mesin', intervalKm: 2000, icon: '🛢️' },
            { name: 'Service CVT', intervalKm: 5000, icon: '⚙️' },
            { name: 'Ganti Belt CVT', intervalKm: 15000, icon: '🔧' },
            { name: 'Ganti Oli Gardan', intervalKm: 8000, icon: '🔩' },
            { name: 'Ganti Kampas Rem', intervalKm: 10000, icon: '🛑' },
            { name: 'Ganti Busi', intervalKm: 6000, icon: '⚡' },
            { name: 'Service Berkala', intervalKm: 4000, icon: '🔍' },
            { name: 'Ganti Filter Udara', intervalKm: 8000, icon: '💨' },
        ];

        const MOTOR_BRANDS = [
            'Honda', 'Yamaha', 'Suzuki', 'Kawasaki', 'TVS', 
            'Vespa', 'Royal Enfield', 'Lainnya'
        ];

        function ServiceMotorApp() {
            const [services, setServices] = useState([]);
            const [showForm, setShowForm] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [firebaseInitialized, setFirebaseInitialized] = useState(false);
            const [error, setError] = useState('');
            const [showWhatsAppModal, setShowWhatsAppModal] = useState(false);
            const [selectedService, setSelectedService] = useState(null);
            const [phoneNumber, setPhoneNumber] = useState('');
            
            // Admin states
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [adminError, setAdminError] = useState('');
            
            const [formData, setFormData] = useState({
                jenisService: '',
                jenisMotor: '',
                merkMotor: '',
                tanggalService: '',
                kmSaatGanti: '',
                catatan: ''
            });

            let database = null;

            useEffect(() => {
                try {
                    if (firebaseConfig.apiKey === "YOUR_API_KEY") {
                        setError('⚠️ Konfigurasi Firebase belum diatur.');
                        setLoading(false);
                        return;
                    }

                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    database = firebase.database();
                    setFirebaseInitialized(true);
                    loadServices();
                    
                    // Check if admin is already logged in (from sessionStorage)
                    const adminStatus = sessionStorage.getItem('isAdmin');
                    if (adminStatus === 'true') {
                        setIsAdmin(true);
                    }
                } catch (err) {
                    setError('❌ Error menginisialisasi Firebase: ' + err.message);
                    setLoading(false);
                }
            }, []);

            const loadServices = () => {
                const servicesRef = firebase.database().ref('services');
                
                servicesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const servicesArray = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        setServices(servicesArray);
                    } else {
                        setServices([]);
                    }
                    setLoading(false);
                });

                return () => servicesRef.off();
            };

            const handleAdminLogin = () => {
                if (adminPassword === ADMIN_PASSWORD) {
                    setIsAdmin(true);
                    sessionStorage.setItem('isAdmin', 'true');
                    setShowAdminLogin(false);
                    setAdminPassword('');
                    setAdminError('');
                } else {
                    setAdminError('❌ Password salah!');
                }
            };

            const handleAdminLogout = () => {
                setIsAdmin(false);
                sessionStorage.removeItem('isAdmin');
            };

            const exportData = () => {
                const dataStr = JSON.stringify(services, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `service-motor-backup-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
            };

            const deleteAllData = async () => {
                if (confirm('⚠️ PERINGATAN! Ini akan menghapus SEMUA data service. Apakah Anda yakin?')) {
                    if (confirm('Konfirmasi sekali lagi: HAPUS SEMUA DATA?')) {
                        try {
                            await firebase.database().ref('services').remove();
                            alert('✅ Semua data berhasil dihapus!');
                        } catch (err) {
                            alert('❌ Error menghapus data: ' + err.message);
                        }
                    }
                }
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: value
                }));
            };

            const calculateNextService = (currentKm, serviceType) => {
                const service = SERVICE_TYPES.find(s => s.name === serviceType);
                const interval = service ? service.intervalKm : 2000;
                return parseInt(currentKm) + interval;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSaving(true);
                
                try {
                    const nextKm = calculateNextService(formData.kmSaatGanti, formData.jenisService);
                    
                    const serviceData = {
                        ...formData,
                        kmSaatGanti: parseInt(formData.kmSaatGanti),
                        kmNextService: nextKm,
                        createdAt: editingId ? 
                            services.find(s => s.id === editingId).createdAt : 
                            new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    };

                    if (editingId) {
                        await firebase.database().ref('services/' + editingId).update(serviceData);
                    } else {
                        await firebase.database().ref('services').push(serviceData);
                    }

                    resetForm();
                } catch (err) {
                    alert('Error menyimpan data: ' + err.message);
                } finally {
                    setSaving(false);
                }
            };

            const handleEdit = (service) => {
                setFormData({
                    jenisService: service.jenisService,
                    jenisMotor: service.jenisMotor,
                    merkMotor: service.merkMotor,
                    tanggalService: service.tanggalService,
                    kmSaatGanti: service.kmSaatGanti.toString(),
                    catatan: service.catatan || ''
                });
                setEditingId(service.id);
                setShowForm(true);
            };

            const handleDelete = async (id) => {
                if (confirm('Yakin ingin menghapus data service ini?')) {
                    try {
                        await firebase.database().ref('services/' + id).remove();
                    } catch (err) {
                        alert('Error menghapus data: ' + err.message);
                    }
                }
            };

            const resetForm = () => {
                setFormData({
                    jenisService: '',
                    jenisMotor: '',
                    merkMotor: '',
                    tanggalService: '',
                    kmSaatGanti: '',
                    catatan: ''
                });
                setEditingId(null);
                setShowForm(false);
            };

            const getServiceIcon = (serviceName) => {
                const service = SERVICE_TYPES.find(s => s.name === serviceName);
                return service ? service.icon : '🔧';
            };

            const openWhatsAppModal = (service) => {
                setSelectedService(service);
                setShowWhatsAppModal(true);
            };

            const sendWhatsAppReminder = () => {
                if (!selectedService) return;
                
                const message = `🏍️ *REMINDER SERVICE MOTOR*

📋 Jenis Service: ${selectedService.jenisService}
🏍️ Motor: ${selectedService.merkMotor} ${selectedService.jenisMotor}
📅 Service Terakhir: ${new Date(selectedService.tanggalService).toLocaleDateString('id-ID')}
📊 KM Terakhir: ${selectedService.kmSaatGanti.toLocaleString('id-ID')} km
🎯 Service Berikutnya: ${selectedService.kmNextService.toLocaleString('id-ID')} km
${selectedService.catatan ? `\n💬 Catatan: ${selectedService.catatan}` : ''}

⚠️ Jangan lupa service motor ya!`;

                let waUrl;
                if (phoneNumber && phoneNumber.trim() !== '') {
                    let cleanNumber = phoneNumber.replace(/\D/g, '');
                    if (cleanNumber.startsWith('0')) {
                        cleanNumber = '62' + cleanNumber.substring(1);
                    } else if (!cleanNumber.startsWith('62')) {
                        cleanNumber = '62' + cleanNumber;
                    }
                    waUrl = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(message)}`;
                } else {
                    waUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
                }

                window.open(waUrl, '_blank');
                setShowWhatsAppModal(false);
                setPhoneNumber('');
            };

            const sendWhatsAppSummary = () => {
                const upcomingServices = services
                    .filter(s => s.kmNextService)
                    .sort((a, b) => a.kmNextService - b.kmNextService)
                    .slice(0, 5);

                let message = `🏍️ *SUMMARY SERVICE MOTOR*\n\n`;
                message += `📊 Total Service Tercatat: ${services.length}\n\n`;
                message += `🎯 *Service Berikutnya:*\n`;

                upcomingServices.forEach((service, index) => {
                    message += `\n${index + 1}. ${service.jenisService}`;
                    message += `\n   ${service.merkMotor} ${service.jenisMotor}`;
                    message += `\n   KM: ${service.kmNextService.toLocaleString('id-ID')} km\n`;
                });

                const waUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
                window.open(waUrl, '_blank');
            };

            const sortedServices = [...services].sort((a, b) => 
                new Date(b.tanggalService) - new Date(a.tanggalService)
            );

            // Filter untuk user biasa: hanya tampilkan service terbaru per kombinasi jenisService + jenisMotor + merkMotor
            const getLatestServicesForUser = () => {
                const serviceMap = new Map();
                
                sortedServices.forEach(service => {
                    const key = `${service.jenisService}-${service.jenisMotor}-${service.merkMotor}`;
                    
                    // Hanya simpan yang pertama (terbaru) untuk setiap kombinasi
                    if (!serviceMap.has(key)) {
                        serviceMap.set(key, service);
                    }
                });
                
                return Array.from(serviceMap.values());
            };

            // Cek apakah service sudah lewat 2 bulan
            const isServiceOverdue = (tanggalService) => {
                const serviceDate = new Date(tanggalService);
                const now = new Date();
                const diffMonths = (now.getFullYear() - serviceDate.getFullYear()) * 12 + 
                                 (now.getMonth() - serviceDate.getMonth());
                return diffMonths >= 2;
            };

            // Pilih data yang akan ditampilkan
            const displayServices = isAdmin ? sortedServices : getLatestServicesForUser();

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
                        <div className="text-center">
                            <div className="loading-spinner mx-auto mb-4"></div>
                            <p className="text-gray-600 text-lg">Loading data...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 py-8 px-4">
                    <div className="max-w-6xl mx-auto">
                        {/* Header */}
                        <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
                            <div className="flex items-center justify-between flex-wrap gap-4">
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-800 flex items-center gap-3 flex-wrap">
                                        🏍️ Service Motor App
                                        <span className="text-sm bg-green-100 text-green-700 px-3 py-1 rounded-full">🌐 Online</span>
                                        <span className="text-sm bg-green-100 text-green-700 px-3 py-1 rounded-full">📱 WhatsApp</span>
                                        {isAdmin && (
                                            <span className="text-sm bg-red-100 text-red-700 px-3 py-1 rounded-full">🔐 Admin</span>
                                        )}
                                    </h1>
                                    <p className="text-gray-600 mt-2">Catat dan pantau jadwal service motor dengan notifikasi WhatsApp</p>
                                </div>
                                <div className="flex gap-2 flex-wrap">
                                    {!isAdmin ? (
                                        <button
                                            onClick={() => setShowAdminLogin(true)}
                                            className="bg-gradient-to-r from-red-600 to-rose-600 text-white px-4 py-2 rounded-xl font-semibold hover:from-red-700 hover:to-rose-700 transition-all shadow-lg text-sm"
                                        >
                                            🔐 Admin
                                        </button>
                                    ) : (
                                        <button
                                            onClick={handleAdminLogout}
                                            className="bg-gradient-to-r from-gray-600 to-gray-700 text-white px-4 py-2 rounded-xl font-semibold hover:from-gray-700 hover:to-gray-800 transition-all shadow-lg text-sm"
                                        >
                                            🚪 Logout Admin
                                        </button>
                                    )}
                                    <button
                                        onClick={sendWhatsAppSummary}
                                        disabled={services.length === 0}
                                        className="bg-gradient-to-r from-green-600 to-emerald-600 text-white px-4 py-2 rounded-xl font-semibold hover:from-green-700 hover:to-emerald-700 transition-all shadow-lg disabled:opacity-50 text-sm"
                                    >
                                        📊 Share Summary
                                    </button>
                                    <button
                                        onClick={() => setShowForm(!showForm)}
                                        disabled={saving}
                                        className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-6 py-2 rounded-xl font-semibold hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg disabled:opacity-50"
                                    >
                                        {showForm ? '✕ Tutup' : '+ Tambah Service'}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Admin Panel - Show directly when admin logged in */}
                        {isAdmin && (
                            <div className="bg-gradient-to-r from-red-50 to-rose-50 border-2 border-red-200 rounded-2xl shadow-xl p-6 mb-6">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-2xl font-bold text-red-800 flex items-center gap-2">
                                        🔐 Admin Panel - Database Management
                                    </h2>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={exportData}
                                            className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold transition-all text-sm"
                                        >
                                            💾 Backup JSON
                                        </button>
                                        <button
                                            onClick={deleteAllData}
                                            className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-semibold transition-all text-sm"
                                        >
                                            🗑️ Hapus Semua
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white p-4 rounded-lg mb-4">
                                    <h3 className="font-bold text-gray-800 mb-2">📊 Statistik Database</h3>
                                    <div className="grid grid-cols-3 gap-4">
                                        <div>
                                            <p className="text-gray-600 text-sm">Total Records</p>
                                            <p className="text-2xl font-bold text-blue-600">{services.length}</p>
                                        </div>
                                        <div>
                                            <p className="text-gray-600 text-sm">Unique Motors</p>
                                            <p className="text-2xl font-bold text-green-600">
                                                {new Set(services.map(s => `${s.merkMotor} ${s.jenisMotor}`)).size}
                                            </p>
                                        </div>
                                        <div>
                                            <p className="text-gray-600 text-sm">Database</p>
                                            <p className="text-lg font-bold text-purple-600">Firebase RT</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Admin Table CRUD */}
                                <div className="bg-white rounded-lg overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm">
                                            <thead className="bg-gray-100 border-b-2 border-gray-200">
                                                <tr>
                                                    <th className="px-4 py-3 text-left font-semibold text-gray-700">Tanggal</th>
                                                    <th className="px-4 py-3 text-left font-semibold text-gray-700">Jenis Service</th>
                                                    <th className="px-4 py-3 text-left font-semibold text-gray-700">Motor</th>
                                                    <th className="px-4 py-3 text-left font-semibold text-gray-700">KM Saat Ganti</th>
                                                    <th className="px-4 py-3 text-left font-semibold text-gray-700">KM Next</th>
                                                    <th className="px-4 py-3 text-left font-semibold text-gray-700">Catatan</th>
                                                    <th className="px-4 py-3 text-center font-semibold text-gray-700">Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {sortedServices.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="7" className="px-4 py-8 text-center text-gray-500">
                                                            Belum ada data
                                                        </td>
                                                    </tr>
                                                ) : (
                                                    sortedServices.map((service, index) => (
                                                        <tr 
                                                            key={service.id}
                                                            className={`border-b border-gray-100 hover:bg-gray-50 ${
                                                                index % 2 === 0 ? 'bg-white' : 'bg-gray-50'
                                                            }`}
                                                        >
                                                            <td className="px-4 py-3 text-gray-800">
                                                                {new Date(service.tanggalService).toLocaleDateString('id-ID', {
                                                                    day: '2-digit',
                                                                    month: 'short',
                                                                    year: 'numeric'
                                                                })}
                                                            </td>
                                                            <td className="px-4 py-3">
                                                                <span className="text-gray-800 font-medium">
                                                                    {getServiceIcon(service.jenisService)} {service.jenisService}
                                                                </span>
                                                            </td>
                                                            <td className="px-4 py-3 text-gray-800">
                                                                <div className="font-medium">{service.merkMotor}</div>
                                                                <div className="text-xs text-gray-500">{service.jenisMotor}</div>
                                                            </td>
                                                            <td className="px-4 py-3 text-gray-800 font-medium">
                                                                {service.kmSaatGanti.toLocaleString('id-ID')} km
                                                            </td>
                                                            <td className="px-4 py-3 text-orange-600 font-bold">
                                                                {service.kmNextService.toLocaleString('id-ID')} km
                                                            </td>
                                                            <td className="px-4 py-3 text-gray-600 text-xs max-w-xs truncate">
                                                                {service.catatan || '-'}
                                                            </td>
                                                            <td className="px-4 py-3">
                                                                <div className="flex gap-2 justify-center">
                                                                    <button
                                                                        onClick={() => handleEdit(service)}
                                                                        className="p-1.5 text-blue-600 hover:bg-blue-100 rounded transition-all"
                                                                        title="Edit"
                                                                    >
                                                                        ✏️
                                                                    </button>
                                                                    <button
                                                                        onClick={() => handleDelete(service.id)}
                                                                        className="p-1.5 text-red-600 hover:bg-red-100 rounded transition-all"
                                                                        title="Hapus"
                                                                    >
                                                                        🗑️
                                                                    </button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="mt-4 bg-yellow-50 border border-yellow-200 p-4 rounded-lg">
                                    <p className="text-sm text-yellow-800">
                                        <strong>⚠️ Info:</strong> Admin melihat SEMUA data historis. User biasa hanya melihat service terbaru per jenis & motor. Password admin ada di baris 54 file HTML.
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* Admin Login Modal */}
                        {showAdminLogin && !isAdmin && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
                                    <h3 className="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                                        🔐 Admin Login
                                    </h3>
                                    
                                    <div className="mb-6">
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                                            Password Admin
                                        </label>
                                        <input
                                            type="password"
                                            value={adminPassword}
                                            onChange={(e) => setAdminPassword(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleAdminLogin()}
                                            placeholder="Masukkan password admin"
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                        />
                                        {adminError && (
                                            <p className="text-red-600 text-sm mt-2">{adminError}</p>
                                        )}
                                    </div>

                                    <div className="flex gap-3">
                                        <button
                                            onClick={handleAdminLogin}
                                            className="flex-1 bg-gradient-to-r from-red-600 to-rose-600 text-white px-6 py-3 rounded-lg font-semibold hover:from-red-700 hover:to-rose-700 transition-all shadow-md"
                                        >
                                            🔓 Login
                                        </button>
                                        <button
                                            onClick={() => {
                                                setShowAdminLogin(false);
                                                setAdminPassword('');
                                                setAdminError('');
                                            }}
                                            className="px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-50 transition-all"
                                        >
                                            Batal
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Form (same as before) */}
                        {showForm && (
                            <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">
                                    {editingId ? '✏️ Edit Service' : '📝 Tambah Service Baru'}
                                </h2>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Jenis Service *
                                            </label>
                                            <select
                                                name="jenisService"
                                                value={formData.jenisService}
                                                onChange={handleInputChange}
                                                required
                                                disabled={saving}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent disabled:bg-gray-100"
                                            >
                                                <option value="">Pilih Jenis Service</option>
                                                {SERVICE_TYPES.map(service => (
                                                    <option key={service.name} value={service.name}>
                                                        {service.icon} {service.name}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Merk Motor *
                                            </label>
                                            <select
                                                name="merkMotor"
                                                value={formData.merkMotor}
                                                onChange={handleInputChange}
                                                required
                                                disabled={saving}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent disabled:bg-gray-100"
                                            >
                                                <option value="">Pilih Merk</option>
                                                {MOTOR_BRANDS.map(brand => (
                                                    <option key={brand} value={brand}>{brand}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Jenis Motor *
                                            </label>
                                            <input
                                                type="text"
                                                name="jenisMotor"
                                                value={formData.jenisMotor}
                                                onChange={handleInputChange}
                                                placeholder="Contoh: Vario 160, NMAX, Beat"
                                                required
                                                disabled={saving}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent disabled:bg-gray-100"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Tanggal Service *
                                            </label>
                                            <input
                                                type="date"
                                                name="tanggalService"
                                                value={formData.tanggalService}
                                                onChange={handleInputChange}
                                                required
                                                disabled={saving}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent disabled:bg-gray-100"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                KM Saat Ganti *
                                            </label>
                                            <input
                                                type="number"
                                                name="kmSaatGanti"
                                                value={formData.kmSaatGanti}
                                                onChange={handleInputChange}
                                                placeholder="Contoh: 5000"
                                                required
                                                disabled={saving}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent disabled:bg-gray-100"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Catatan (Opsional)
                                            </label>
                                            <input
                                                type="text"
                                                name="catatan"
                                                value={formData.catatan}
                                                onChange={handleInputChange}
                                                placeholder="Catatan tambahan..."
                                                disabled={saving}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent disabled:bg-gray-100"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex gap-3 pt-4">
                                        <button
                                            type="submit"
                                            disabled={saving}
                                            className="flex-1 bg-gradient-to-r from-green-600 to-emerald-600 text-white px-6 py-3 rounded-lg font-semibold hover:from-green-700 hover:to-emerald-700 transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                        >
                                            {saving ? (
                                                <>
                                                    <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                                    Menyimpan...
                                                </>
                                            ) : (
                                                <>{editingId ? '💾 Update Service' : '✅ Simpan Service'}</>
                                            )}
                                        </button>
                                        <button
                                            type="button"
                                            onClick={resetForm}
                                            disabled={saving}
                                            className="px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-50 transition-all disabled:opacity-50"
                                        >
                                            Batal
                                        </button>
                                    </div>
                                </form>
                            </div>
                        )}

                        {/* Services List - Only for non-admin users */}
                        {!isAdmin && (
                            <div className="bg-white rounded-2xl shadow-xl p-6">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                                    📋 Riwayat Service ({isAdmin ? services.length : displayServices.length})
                                    {!isAdmin && services.length > displayServices.length && (
                                        <span className="text-sm text-gray-500 font-normal">
                                            (Menampilkan service terbaru per motor)
                                        </span>
                                    )}
                                </h2>

                                {displayServices.length === 0 ? (
                                    <div className="text-center py-16">
                                        <div className="text-6xl mb-4">🏍️</div>
                                        <p className="text-gray-500 text-lg">Belum ada data service</p>
                                        <p className="text-gray-400 mt-2">Klik tombol "Tambah Service" untuk memulai</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                        {displayServices.map(service => {
                                            const isOverdue = isServiceOverdue(service.tanggalService);
                                            
                                            return (
                                                <div 
                                                    key={service.id}
                                                    className={`border-2 rounded-xl p-5 hover:shadow-lg transition-all ${
                                                        isOverdue 
                                                            ? 'bg-red-50 border-red-300 hover:border-red-400' 
                                                            : 'border-gray-200 hover:border-blue-300'
                                                    }`}
                                                >
                                                    {isOverdue && (
                                                        <div className="bg-red-500 text-white px-3 py-1 rounded-lg mb-3 text-sm font-semibold flex items-center gap-2">
                                                            ⚠️ Sudah lewat 2 bulan! Segera service!
                                                        </div>
                                                    )}
                                                    
                                                    <div className="flex items-start justify-between mb-4">
                                                        <div className="flex items-center gap-3">
                                                            <span className="text-3xl">{getServiceIcon(service.jenisService)}</span>
                                                            <div>
                                                                <h3 className="font-bold text-lg text-gray-800">
                                                                    {service.jenisService}
                                                                </h3>
                                                                <p className="text-sm text-gray-600">
                                                                    {service.merkMotor} {service.jenisMotor}
                                                                </p>
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-2">
                                                            <button
                                                                onClick={() => handleEdit(service)}
                                                                className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-all"
                                                                title="Edit"
                                                            >
                                                                ✏️
                                                            </button>
                                                            <button
                                                                onClick={() => handleDelete(service.id)}
                                                                className="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-all"
                                                                title="Hapus"
                                                            >
                                                                🗑️
                                                            </button>
                                                        </div>
                                                    </div>

                                                    <div className="grid grid-cols-2 gap-3 text-sm">
                                                        <div className={`p-3 rounded-lg ${isOverdue ? 'bg-red-100' : 'bg-blue-50'}`}>
                                                            <p className="text-gray-600 mb-1">📅 Tanggal Service</p>
                                                            <p className={`font-semibold ${isOverdue ? 'text-red-800' : 'text-gray-800'}`}>
                                                                {new Date(service.tanggalService).toLocaleDateString('id-ID', {
                                                                    day: 'numeric',
                                                                    month: 'long',
                                                                    year: 'numeric'
                                                                })}
                                                            </p>
                                                        </div>
                                                        <div className="bg-green-50 p-3 rounded-lg">
                                                            <p className="text-gray-600 mb-1">📊 KM Saat Ganti</p>
                                                            <p className="font-semibold text-gray-800">
                                                                {service.kmSaatGanti.toLocaleString('id-ID')} km
                                                            </p>
                                                        </div>
                                                        <div className="bg-yellow-50 p-3 rounded-lg col-span-2">
                                                            <p className="text-gray-600 mb-1">🎯 Service Berikutnya</p>
                                                            <p className="font-bold text-lg text-orange-600">
                                                                {service.kmNextService.toLocaleString('id-ID')} km
                                                            </p>
                                                        </div>
                                                    </div>

                                                    <div className="mt-4">
                                                        <button
                                                            onClick={() => openWhatsAppModal(service)}
                                                            className={`w-full text-white px-4 py-3 rounded-lg font-semibold transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2 ${
                                                                isOverdue
                                                                    ? 'bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700'
                                                                    : 'bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700'
                                                            }`}
                                                        >
                                                            <span className="text-xl">📱</span>
                                                            Kirim Reminder via WhatsApp
                                                        </button>
                                                    </div>

                                                    {service.catatan && (
                                                        <div className="mt-3 p-3 bg-gray-50 rounded-lg">
                                                            <p className="text-xs text-gray-600 mb-1">💬 Catatan:</p>
                                                            <p className="text-sm text-gray-800">{service.catatan}</p>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* WhatsApp Modal */}
                        {showWhatsAppModal && selectedService && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
                                    <h3 className="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                                        📱 Kirim ke WhatsApp
                                    </h3>
                                    
                                    <div className="mb-6">
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                                            Nomor WhatsApp (Opsional)
                                        </label>
                                        <input
                                            type="text"
                                            value={phoneNumber}
                                            onChange={(e) => setPhoneNumber(e.target.value)}
                                            placeholder="Contoh: 08123456789 atau 628123456789"
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                                        />
                                        <p className="text-xs text-gray-500 mt-2">
                                            Kosongkan untuk memilih kontak dari WhatsApp
                                        </p>
                                    </div>

                                    <div className="bg-gray-50 p-4 rounded-lg mb-6">
                                        <p className="text-sm text-gray-600 mb-2 font-semibold">Preview Pesan:</p>
                                        <div className="text-sm text-gray-700 whitespace-pre-line">
                                            🏍️ <strong>REMINDER SERVICE MOTOR</strong>
                                            <br/><br/>
                                            📋 Jenis Service: {selectedService.jenisService}
                                            <br/>
                                            🏍️ Motor: {selectedService.merkMotor} {selectedService.jenisMotor}
                                            <br/>
                                            📅 Service Terakhir: {new Date(selectedService.tanggalService).toLocaleDateString('id-ID')}
                                            <br/>
                                            📊 KM Terakhir: {selectedService.kmSaatGanti.toLocaleString('id-ID')} km
                                            <br/>
                                            🎯 Service Berikutnya: {selectedService.kmNextService.toLocaleString('id-ID')} km
                                        </div>
                                    </div>

                                    <div className="flex gap-3">
                                        <button
                                            onClick={sendWhatsAppReminder}
                                            className="flex-1 bg-gradient-to-r from-green-600 to-emerald-600 text-white px-6 py-3 rounded-lg font-semibold hover:from-green-700 hover:to-emerald-700 transition-all shadow-md"
                                        >
                                            📤 Kirim Sekarang
                                        </button>
                                        <button
                                            onClick={() => {
                                                setShowWhatsAppModal(false);
                                                setPhoneNumber('');
                                            }}
                                            className="px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-50 transition-all"
                                        >
                                            Batal
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Footer */}
                        <div className="text-center mt-8 text-gray-600">
                            <p className="text-sm">🌐 Data tersimpan di Firebase Realtime Database</p>
                            <p className="text-xs mt-1 text-gray-500">📱 Notifikasi WhatsApp terintegrasi • 🔐 Admin Protected</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ServiceMotorApp />, document.getElementById('root'));
    </script>
</body>
</html>
