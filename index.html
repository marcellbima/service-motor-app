<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ JARVIS | Motor Service Engineering System</title>
    <meta name="description" content="JARVIS-powered motor service tracking system">
    <meta name="theme-color" content="#000000">

    <link rel="icon" type="image/x-icon" href="favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Flatpickr CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            background: #000000;
            color: #00e5ff;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Grid Background Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        /* JARVIS Typography */
        .jarvis-title {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #00e5ff;
            text-shadow: 
                0 0 10px rgba(0, 229, 255, 1),
                0 0 20px rgba(0, 229, 255, 0.8),
                0 0 30px rgba(0, 229, 255, 0.6);
        }
        
        .jarvis-text {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
        }
        
        /* Circular UI Elements */
        .circle-container {
            position: relative;
            width: 200px;
            height: 200px;
        }
        
        .circle-ring {
            position: absolute;
            border: 2px solid rgba(0, 229, 255, 0.3);
            border-radius: 50%;
            animation: rotate-ring 20s linear infinite;
        }
        
        .circle-ring-1 {
            width: 100%;
            height: 100%;
            border-top-color: #00e5ff;
            border-right-color: #00e5ff;
        }
        
        .circle-ring-2 {
            width: 85%;
            height: 85%;
            top: 7.5%;
            left: 7.5%;
            border-bottom-color: #ff9500;
            animation-duration: 15s;
            animation-direction: reverse;
        }
        
        .circle-ring-3 {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border-left-color: #00ff88;
            animation-duration: 25s;
        }
        
        @keyframes rotate-ring {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Hexagon Background Pattern */
        .hex-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l25.98 15v30L30 60 4.02 45V15z' fill='none' stroke='%2300e5ff' stroke-width='1'/%3E%3C/svg%3E");
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }
        
        /* Glass Morphism Panels */
        .glass-panel {
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            box-shadow: 
                0 0 20px rgba(0, 229, 255, 0.2),
                inset 0 0 20px rgba(0, 229, 255, 0.05);
            position: relative;
            overflow: hidden;
        }
        
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.1), transparent);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        
        /* Corner Brackets */
        .corner-bracket {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #00e5ff;
        }
        
        .corner-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .corner-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
        .corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
        
        /* Neon Button */
        .neon-button {
            background: transparent;
            border: 2px solid #00e5ff;
            color: #00e5ff;
            padding: 12px 24px;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 10px rgba(0, 229, 255, 0.5),
                inset 0 0 10px rgba(0, 229, 255, 0.1);
        }
        
        .neon-button:hover {
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 
                0 0 20px rgba(0, 229, 255, 0.8),
                inset 0 0 20px rgba(0, 229, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .neon-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 229, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }
        
        .neon-button:active::before {
            width: 300px;
            height: 300px;
        }
        
        /* Success Button */
        .neon-button-success {
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 
                0 0 10px rgba(0, 255, 136, 0.5),
                inset 0 0 10px rgba(0, 255, 136, 0.1);
        }
        
        .neon-button-success:hover {
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.8),
                inset 0 0 20px rgba(0, 255, 136, 0.2);
        }
        
        /* Danger Button */
        .neon-button-danger {
            border-color: #ff0844;
            color: #ff0844;
            box-shadow: 
                0 0 10px rgba(255, 8, 68, 0.5),
                inset 0 0 10px rgba(255, 8, 68, 0.1);
        }
        
        .neon-button-danger:hover {
            background: rgba(255, 8, 68, 0.1);
            box-shadow: 
                0 0 20px rgba(255, 8, 68, 0.8),
                inset 0 0 20px rgba(255, 8, 68, 0.2);
        }
        
        /* Warning Button */
        .neon-button-warning {
            border-color: #ff9500;
            color: #ff9500;
            box-shadow: 
                0 0 10px rgba(255, 149, 0, 0.5),
                inset 0 0 10px rgba(255, 149, 0, 0.1);
        }
        
        .neon-button-warning:hover {
            background: rgba(255, 149, 0, 0.1);
            box-shadow: 
                0 0 20px rgba(255, 149, 0, 0.8),
                inset 0 0 20px rgba(255, 149, 0, 0.2);
        }
        
        /* Input Fields */
        .jarvis-input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 4px;
            padding: 12px 16px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.05);
        }
        
        .jarvis-input:focus {
            border-color: #00e5ff;
            box-shadow: 
                0 0 15px rgba(0, 229, 255, 0.5),
                inset 0 0 15px rgba(0, 229, 255, 0.1);
        }
        
        .jarvis-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        /* Data Display Boxes */
        .data-box {
            background: rgba(0, 229, 255, 0.05);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-left: 3px solid #00e5ff;
            padding: 12px;
            margin: 8px 0;
            position: relative;
        }
        
        .data-box-orange {
            border-left-color: #ff9500;
            background: rgba(255, 149, 0, 0.05);
        }
        
        .data-box-green {
            border-left-color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
        }
        
        .data-box-red {
            border-left-color: #ff0844;
            background: rgba(255, 56, 106, 0.142);
        }
        
        /* Status Indicators */
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px currentColor;
            animation: pulse-dot 2s infinite;
        }
        
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-online { background: #00ff88; color: #00ff88; }
        .status-warning { background: #ff9500; color: #ff9500; }
        .status-critical { background: #ff0844; color: #ff0844; }
        
        /* Loading Spinner */
        .jarvis-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0, 229, 255, 0.2);
            border-top: 3px solid #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }
        
        ::-webkit-scrollbar-track {
            background: #000000;
            border: 1px solid rgba(0, 229, 255, 0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00e5ff 0%, #0088aa 100%);
            border-radius: 6px;
            border: 2px solid #000000;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.8);
        }
        
        /* Table Styles */
        .jarvis-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        
        .jarvis-table thead {
            background: rgba(0, 229, 255, 0.1);
            border-top: 2px solid #00e5ff;
            border-bottom: 2px solid #00e5ff;
        }
        
        .jarvis-table th {
            padding: 16px;
            text-align: left;
            color: #00e5ff;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
        }
        
        .jarvis-table td {
            padding: 16px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.1);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
        }
        
        .jarvis-table tbody tr {
            transition: all 0.3s ease;
        }
        
        .jarvis-table tbody tr:hover {
            background: rgba(0, 229, 255, 0.05);
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.1);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .jarvis-title {
                font-size: 18px;
                letter-spacing: 2px;
            }
            
            .circle-container {
                width: 150px;
                height: 150px;
            }
            
            .neon-button {
                padding: 10px 20px;
                font-size: 12px;
            }
        }
        
        /* ===== FLATPICKR JARVIS STYLE ===== */
        .flatpickr-calendar {
            background: rgba(0, 0, 0, 0.95) !important;
            border: 2px solid #00e5ff !important;
            box-shadow: 
                0 0 30px rgba(0, 229, 255, 0.6),
                inset 0 0 20px rgba(0, 229, 255, 0.1) !important;
            border-radius: 8px !important;
            font-family: 'Rajdhani', sans-serif !important;
        }
        
        .flatpickr-calendar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00e5ff, transparent);
            animation: scan-calendar 3s linear infinite;
        }
        
        @keyframes scan-calendar {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        .flatpickr-months {
            background: rgba(0, 229, 255, 0.1) !important;
            border-bottom: 1px solid #00e5ff !important;
            padding: 10px 0 !important;
        }
        
        .flatpickr-current-month {
            color: #00e5ff !important;
            font-family: 'Orbitron', monospace !important;
            font-weight: 700 !important;
            font-size: 14px !important;
            letter-spacing: 2px !important;
            text-transform: uppercase !important;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.8) !important;
        }
        
        .flatpickr-month {
            color: #00e5ff !important;
        }
        
        .flatpickr-monthDropdown-months {
            background: rgba(0, 0, 0, 0.9) !important;
            border: 1px solid #00e5ff !important;
            color: #00e5ff !important;
            font-family: 'Rajdhani', sans-serif !important;
            font-weight: 600 !important;
        }
        
        .flatpickr-monthDropdown-months:hover {
            background: rgba(0, 229, 255, 0.1) !important;
        }
        
        .numInputWrapper:hover,
        .flatpickr-monthDropdown-months:hover {
            background: rgba(0, 229, 255, 0.1) !important;
        }
        
        .numInput {
            background: transparent !important;
            color: #00e5ff !important;
            font-family: 'Orbitron', monospace !important;
            font-weight: 700 !important;
        }
        
        .flatpickr-prev-month,
        .flatpickr-next-month {
            fill: #00e5ff !important;
            transition: all 0.3s ease !important;
        }
        
        .flatpickr-prev-month:hover,
        .flatpickr-next-month:hover {
            fill: #ffffff !important;
            filter: drop-shadow(0 0 5px #00e5ff) !important;
        }
        
        .flatpickr-prev-month:hover svg,
        .flatpickr-next-month:hover svg {
            fill: #ffffff !important;
        }
        
        .flatpickr-weekdays {
            background: rgba(0, 229, 255, 0.05) !important;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3) !important;
        }
        
        .flatpickr-weekday {
            color: #00e5ff !important;
            font-family: 'Orbitron', monospace !important;
            font-weight: 600 !important;
            font-size: 11px !important;
            letter-spacing: 1px !important;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5) !important;
        }
        
        .flatpickr-days {
            background: rgba(0, 0, 0, 0.8) !important;
        }
        
        .flatpickr-day {
            color: #ffffff !important;
            border: 1px solid transparent !important;
            font-family: 'Rajdhani', sans-serif !important;
            font-weight: 500 !important;
            transition: all 0.2s ease !important;
        }
        
        .flatpickr-day:hover {
            background: rgba(0, 229, 255, 0.2) !important;
            border-color: #00e5ff !important;
            color: #00e5ff !important;
            box-shadow: 
                0 0 10px rgba(0, 229, 255, 0.5),
                inset 0 0 10px rgba(0, 229, 255, 0.2) !important;
        }
        
        .flatpickr-day.today {
            border-color: #ff9500 !important;
            background: rgba(255, 149, 0, 0.1) !important;
            color: #ff9500 !important;
            font-weight: 700 !important;
        }
        
        .flatpickr-day.today:hover {
            border-color: #ff9500 !important;
            background: rgba(255, 149, 0, 0.2) !important;
            box-shadow: 
                0 0 10px rgba(255, 149, 0, 0.5),
                inset 0 0 10px rgba(255, 149, 0, 0.2) !important;
        }
        
        .flatpickr-day.selected {
            background: #00e5ff !important;
            border-color: #00e5ff !important;
            color: #000000 !important;
            font-weight: 700 !important;
            box-shadow: 
                0 0 20px rgba(0, 229, 255, 0.8),
                inset 0 0 10px rgba(0, 229, 255, 0.3) !important;
        }
        
        .flatpickr-day.selected:hover {
            background: #00fff2 !important;
            border-color: #00fff2 !important;
        }
        
        .flatpickr-day.prevMonthDay,
        .flatpickr-day.nextMonthDay {
            color: rgba(255, 255, 255, 0.3) !important;
        }
        
        .flatpickr-day.disabled {
            color: rgba(255, 255, 255, 0.2) !important;
        }
        
        .flatpickr-time {
            background: rgba(0, 229, 255, 0.05) !important;
            border-top: 1px solid #00e5ff !important;
        }
        
        .flatpickr-time input {
            background: transparent !important;
            color: #00e5ff !important;
            font-family: 'Orbitron', monospace !important;
            font-weight: 700 !important;
        }
        
        .flatpickr-time .flatpickr-am-pm {
            color: #00e5ff !important;
            font-family: 'Orbitron', monospace !important;
        }
        
        /* Corner brackets for calendar */
        .flatpickr-calendar::after,
        .flatpickr-calendar::before {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid #00e5ff;
        }
        
        .flatpickr-calendar::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }
        
        .flatpickr-calendar::after {
            top: -2px;
            right: -2px;
            border-left: none;
            border-bottom: none;
        }
        
        /* Animation Classes */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .slide-up {
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

                                longhand: ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember']
                            }
                        },
                        onChange: function(selectedDates, dateStr) {
                            setFormData({...formData, tanggalService: dateStr});
                        }
                    });
                }
            }, [showForm]);

            const loadServices = () => {
                const servicesRef = firebase.database().ref('services');
                servicesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const servicesArray = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        setServices(servicesArray);
                    } else {
                        setServices([]);
                    }
                    setLoading(false);
                });
            };

            const handleAdminLogin = () => {
                if (adminPassword === ADMIN_PASSWORD) {
                    setIsAdmin(true);
                    sessionStorage.setItem('isAdmin', 'true');
                    setShowAdminLogin(false);
                    setAdminPassword('');
                } else {
                    alert('❌ Password salah!');
                }
            };

            const handleAdminLogout = () => {
                setIsAdmin(false);
                sessionStorage.removeItem('isAdmin');
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSaving(true);
                
                try {
                    const service = SERVICE_TYPES.find(s => s.name === formData.jenisService);
                    const nextKm = parseInt(formData.kmSaatGanti) + (service ? service.intervalKm : 2000);
                    
                    const serviceData = {
                        ...formData,
                        kmSaatGanti: parseInt(formData.kmSaatGanti),
                        kmNextService: nextKm,
                        createdAt: editingId ? 
                            services.find(s => s.id === editingId).createdAt : 
                            new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    };

                    if (editingId) {
                        await firebase.database().ref('services/' + editingId).update(serviceData);
                    } else {
                        await firebase.database().ref('services').push(serviceData);
                    }

                    setFormData({
                        jenisService: '',
                        jenisMotor: '',
                        merkMotor: '',
                        tanggalService: '',
                        kmSaatGanti: '',
                        catatan: ''
                    });
                    setEditingId(null);
                    setShowForm(false);
                } catch (err) {
                    alert('Error: ' + err.message);
                } finally {
                    setSaving(false);
                }
            };

            const handleEdit = (service) => {
                setFormData({
                    jenisService: service.jenisService,
                    jenisMotor: service.jenisMotor,
                    merkMotor: service.merkMotor,
                    tanggalService: service.tanggalService,
                    kmSaatGanti: service.kmSaatGanti.toString(),
                    catatan: service.catatan || ''
                });
                setEditingId(service.id);
                setShowForm(true);
            };

            const handleDelete = async (id) => {
                if (confirm('Hapus data ini?')) {
                    try {
                        await firebase.database().ref('services/' + id).remove();
                    } catch (err) {
                        alert('Error: ' + err.message);
                    }
                }
            };

            const exportData = () => {
                const dataStr = JSON.stringify(services, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `service-backup-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
            };

            const deleteAllData = async () => {
                if (confirm('⚠️ HAPUS SEMUA DATA?') && confirm('YAKIN?')) {
                    try {
                        await firebase.database().ref('services').remove();
                        alert('✅ Data terhapus!');
                    } catch (err) {
                        alert('Error: ' + err.message);
                    }
                }
            };

            const isServiceOverdue = (tanggalService) => {
                const serviceDate = new Date(tanggalService);
                const now = new Date();
                const diffMonths = (now.getFullYear() - serviceDate.getFullYear()) * 12 + 
                                 (now.getMonth() - serviceDate.getMonth());
                return diffMonths >= 2;
            };

            const sortedServices = [...services].sort((a, b) => 
                new Date(b.tanggalService) - new Date(a.tanggalService)
            );

            const getLatestServicesForUser = () => {
                const serviceMap = new Map();
                sortedServices.forEach(service => {
                    const key = `${service.jenisService}-${service.jenisMotor}-${service.merkMotor}`;
                    if (!serviceMap.has(key)) {
                        serviceMap.set(key, service);
                    }
                });
                return Array.from(serviceMap.values());
            };

            const displayServices = isAdmin ? sortedServices : getLatestServicesForUser();

            if (loading) {
                return (
                    <div style={{
                        minHeight: '100vh',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        flexDirection: 'column'
                    }}>
                        <div className="jarvis-spinner"></div>
                        <p className="jarvis-text" style={{marginTop: '20px', fontSize: '18px'}}>
                            INITIALIZING JARVIS SYSTEM...
                        </p>
                    </div>
                );
            }

            return (
                <div style={{minHeight: '100vh', padding: '20px'}}>
                    {/* Header */}
                    <header className="glass-panel fade-in" style={{padding: '20px', marginBottom: '30px', position: 'relative'}}>
                        <div className="corner-bracket corner-tl"></div>
                        <div className="corner-bracket corner-tr"></div>
                        <div className="corner-bracket corner-bl"></div>
                        <div className="corner-bracket corner-br"></div>
                        
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '20px'}}>
                            <div>
                                <h1 className="jarvis-title" style={{fontSize: '28px', marginBottom: '10px'}}>
                                    ⚡ JARVIS MOTOR SERVICE
                                </h1>
                                <p className="jarvis-text" style={{fontSize: '14px', opacity: 0.7}}>
                                    <span className="status-dot status-online"></span>
                                    SYSTEM ONLINE | DATABASE CONNECTED
                                </p>
                            </div>
                            
                            <div style={{display: 'flex', gap: '10px', flexWrap: 'wrap'}}>
                                {!isAdmin ? (
                                    <button onClick={() => setShowAdminLogin(true)} className="neon-button neon-button-danger">
                                        🔐 ADMIN ACCESS
                                    </button>
                                ) : (
                                    <button onClick={handleAdminLogout} className="neon-button">
                                        🚪 LOGOUT
                                    </button>
                                )}
                                <button onClick={() => setShowForm(!showForm)} className="neon-button neon-button-success">
                                    {showForm ? '✕ CLOSE' : '+ ADD SERVICE'}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Admin Login Modal */}
                    {showAdminLogin && (
                        <div style={{
                            position: 'fixed',
                            top: 0,
                            left: 0,
                            width: '100%',
                            height: '100%',
                            background: 'rgba(0, 0, 0, 0.9)',
                            backdropFilter: 'blur(5px)',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            zIndex: 9999
                        }}>
                            <div className="glass-panel slide-up" style={{width: '400px', maxWidth: '90%', padding: '30px', position: 'relative'}}>
                                <div className="corner-bracket corner-tl"></div>
                                <div className="corner-bracket corner-tr"></div>
                                <div className="corner-bracket corner-bl"></div>
                                <div className="corner-bracket corner-br"></div>
                                
                                <h2 className="jarvis-title" style={{fontSize: '20px', marginBottom: '20px', textAlign: 'center'}}>
                                    🔐 ADMIN AUTHENTICATION
                                </h2>
                                
                                <input
                                    type="password"
                                    value={adminPassword}
                                    onChange={(e) => setAdminPassword(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleAdminLogin()}
                                    placeholder="Enter password..."
                                    className="jarvis-input"
                                    style={{width: '100%', marginBottom: '20px'}}
                                />
                                
                                <div style={{display: 'flex', gap: '10px'}}>
                                    <button onClick={handleAdminLogin} className="neon-button neon-button-success" style={{flex: 1}}>
                                        AUTHENTICATE
                                    </button>
                                    <button onClick={() => setShowAdminLogin(false)} className="neon-button" style={{flex: 1}}>
                                        CANCEL
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Form */}
                    {showForm && (
                        <div className="glass-panel slide-up" style={{padding: '30px', marginBottom: '30px', position: 'relative'}}>
                            <div className="corner-bracket corner-tl"></div>
                            <div className="corner-bracket corner-tr"></div>
                            <div className="corner-bracket corner-bl"></div>
                            <div className="corner-bracket corner-br"></div>
                            
                            <h2 className="jarvis-title" style={{fontSize: '20px', marginBottom: '20px'}}>
                                {editingId ? '✏️ UPDATE SERVICE DATA' : '📝 NEW SERVICE ENTRY'}
                            </h2>
                            
                            <form onSubmit={handleSubmit}>
                                <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '15px'}}>
                                    <div>
                                        <label className="jarvis-text" style={{display: 'block', marginBottom: '8px', fontSize: '14px'}}>
                                            JENIS SERVICE *
                                        </label>
                                        <select
                                            value={formData.jenisService}
                                            onChange={(e) => setFormData({...formData, jenisService: e.target.value})}
                                            required
                                            className="jarvis-input"
                                            style={{width: '100%'}}
                                        >
                                            <option value="">Select...</option>
                                            {SERVICE_TYPES.map(s => (
                                                <option key={s.name} value={s.name}>{s.icon} {s.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                    
                                    <div>
                                        <label className="jarvis-text" style={{display: 'block', marginBottom: '8px', fontSize: '14px'}}>
                                            MERK MOTOR *
                                        </label>
                                        <select
                                            value={formData.merkMotor}
                                            onChange={(e) => setFormData({...formData, merkMotor: e.target.value})}
                                            required
                                            className="jarvis-input"
                                            style={{width: '100%'}}
                                        >
                                            <option value="">Select...</option>
                                            {MOTOR_BRANDS.map(b => (
                                                <option key={b} value={b}>{b}</option>
                                            ))}
                                        </select>
                                    </div>
                                    
                                    <div>
                                        <label className="jarvis-text" style={{display: 'block', marginBottom: '8px', fontSize: '14px'}}>
                                            JENIS MOTOR *
                                        </label>
                                        <input
                                            type="text"
                                            value={formData.jenisMotor}
                                            onChange={(e) => setFormData({...formData, jenisMotor: e.target.value})}
                                            placeholder="Vario 160, NMAX..."
                                            required
                                            className="jarvis-input"
                                            style={{width: '100%'}}
                                        />
                                    </div>
                                    
                                    <div>
                                        <label className="jarvis-text" style={{display: 'block', marginBottom: '8px', fontSize: '14px'}}>
                                            TANGGAL SERVICE *
                                        </label>
                                        <div style={{position: 'relative'}}>
                                            <input
                                                id="tanggalServiceInput"
                                                type="text"
                                                value={formData.tanggalService}
                                                onChange={(e) => setFormData({...formData, tanggalService: e.target.value})}
                                                placeholder="Pilih tanggal..."
                                                required
                                                className="jarvis-input"
                                                style={{width: '100%', paddingRight: '40px'}}
                                            />
                                            <span style={{
                                                position: 'absolute',
                                                right: '12px',
                                                top: '50%',
                                                transform: 'translateY(-50%)',
                                                color: '#00e5ff',
                                                fontSize: '18px',
                                                pointerEvents: 'none'
                                            }}>📅</span>
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="jarvis-text" style={{display: 'block', marginBottom: '8px', fontSize: '14px'}}>
                                            KM SAAT GANTI *
                                        </label>
                                        <input
                                            type="number"
                                            value={formData.kmSaatGanti}
                                            onChange={(e) => setFormData({...formData, kmSaatGanti: e.target.value})}
                                            placeholder="5000"
                                            required
                                            className="jarvis-input"
                                            style={{width: '100%'}}
                                        />
                                    </div>
                                    
                                    <div>
                                        <label className="jarvis-text" style={{display: 'block', marginBottom: '8px', fontSize: '14px'}}>
                                            CATATAN
                                        </label>
                                        <input
                                            type="text"
                                            value={formData.catatan}
                                            onChange={(e) => setFormData({...formData, catatan: e.target.value})}
                                            placeholder="Notes..."
                                            className="jarvis-input"
                                            style={{width: '100%'}}
                                        />
                                    </div>
                                </div>
                                
                                <div style={{display: 'flex', gap: '10px', marginTop: '20px'}}>
                                    <button type="submit" disabled={saving} className="neon-button neon-button-success" style={{flex: 1}}>
                                        {saving ? 'SAVING...' : (editingId ? 'UPDATE' : 'SAVE')}
                                    </button>
                                    <button type="button" onClick={() => {setShowForm(false); setEditingId(null);}} className="neon-button">
                                        CANCEL
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Admin Table */}
                    {isAdmin && (
                        <div className="glass-panel fade-in" style={{padding: '30px', marginBottom: '30px', position: 'relative'}}>
                            <div className="corner-bracket corner-tl"></div>
                            <div className="corner-bracket corner-tr"></div>
                            <div className="corner-bracket corner-bl"></div>
                            <div className="corner-bracket corner-br"></div>
                            
                            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', flexWrap: 'wrap', gap: '10px'}}>
                                <h2 className="jarvis-title" style={{fontSize: '20px'}}>
                                    🗄️ DATABASE MANAGEMENT
                                </h2>
                                <div style={{display: 'flex', gap: '10px'}}>
                                    <button onClick={exportData} className="neon-button">💾 BACKUP</button>
                                    <button onClick={deleteAllData} className="neon-button neon-button-danger">🗑️ DELETE ALL</button>
                                </div>
                            </div>
                            
                            <div style={{overflowX: 'auto'}}>
                                <table className="jarvis-table">
                                    <thead>
                                        <tr>
                                            <th>DATE</th>
                                            <th>SERVICE</th>
                                            <th>MOTOR</th>
                                            <th>KM CURRENT</th>
                                            <th>KM NEXT</th>
                                            <th>NOTES</th>
                                            <th>ACTIONS</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {sortedServices.map(s => (
                                            <tr key={s.id}>
                                                <td>{new Date(s.tanggalService).toLocaleDateString('id-ID')}</td>
                                                <td>{s.jenisService}</td>
                                                <td>{s.merkMotor} {s.jenisMotor}</td>
                                                <td>{s.kmSaatGanti.toLocaleString('id-ID')} km</td>
                                                <td style={{color: '#ff9500'}}>{s.kmNextService.toLocaleString('id-ID')} km</td>
                                                <td style={{maxWidth: '200px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>
                                                    {s.catatan || '-'}
                                                </td>
                                                <td>
                                                    <button onClick={() => handleEdit(s)} className="neon-button" style={{padding: '6px 12px', marginRight: '5px'}}>
                                                        ✏️
                                                    </button>
                                                    <button onClick={() => handleDelete(s.id)} className="neon-button neon-button-danger" style={{padding: '6px 12px'}}>
                                                        🗑️
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* Services Grid for Users */}
                    {!isAdmin && (
                        <div>
                            <h2 className="jarvis-title" style={{fontSize: '20px', marginBottom: '20px'}}>
                                📊 SERVICE RECORDS ({displayServices.length})
                            </h2>
                            
                            {displayServices.length === 0 ? (
                                <div className="glass-panel" style={{padding: '60px', textAlign: 'center'}}>
                                    <p className="jarvis-text" style={{fontSize: '18px', opacity: 0.5}}>
                                        NO SERVICE RECORDS FOUND
                                    </p>
                                </div>
                            ) : (
                                <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: '20px'}}>
                                    {displayServices.map(s => {
                                        const overdue = isServiceOverdue(s.tanggalService);
                                        return (
                                            <div key={s.id} className={`glass-panel slide-up ${overdue ? 'data-box-red' : ''}`} style={{padding: '20px', position: 'relative'}}>
                                                <div className="corner-bracket corner-tl"></div>
                                                <div className="corner-bracket corner-tr"></div>
                                                <div className="corner-bracket corner-bl"></div>
                                                <div className="corner-bracket corner-br"></div>
                                                
                                                {overdue && (
                                                    <div style={{
                                                        background: 'rgba(255, 8, 68, 0.2)',
                                                        border: '1px solid #ff0844',
                                                        padding: '8px',
                                                        marginBottom: '15px',
                                                        borderRadius: '4px',
                                                        textAlign: 'center'
                                                    }}>
                                                        <span className="jarvis-text" style={{color: '#ff0844', fontSize: '12px', fontWeight: 700}}>
                                                            ⚠️ OVERDUE - SERVICE REQUIRED
                                                        </span>
                                                    </div>
                                                )}
                                                
                                                <div style={{marginBottom: '15px'}}>
                                                    <h3 className="jarvis-title" style={{fontSize: '16px', marginBottom: '5px'}}>
                                                        {s.jenisService}
                                                    </h3>
                                                    <p className="jarvis-text" style={{fontSize: '14px', opacity: 0.7}}>
                                                        {s.merkMotor} {s.jenisMotor}
                                                    </p>
                                                </div>
                                                
                                                <div className="data-box" style={{marginBottom: '10px'}}>
                                                    <p className="jarvis-text" style={{fontSize: '12px', opacity: 0.7}}>DATE</p>
                                                    <p className="jarvis-text" style={{fontSize: '14px', fontWeight: 600}}>
                                                        {new Date(s.tanggalService).toLocaleDateString('id-ID', {
                                                            day: 'numeric',
                                                            month: 'long',
                                                            year: 'numeric'
                                                        })}
                                                    </p>
                                                </div>
                                                
                                                <div className="data-box data-box-green" style={{marginBottom: '10px'}}>
                                                    <p className="jarvis-text" style={{fontSize: '12px', opacity: 0.7}}>CURRENT KM</p>
                                                    <p className="jarvis-text" style={{fontSize: '16px', fontWeight: 700, color: '#00ff88'}}>
                                                        {s.kmSaatGanti.toLocaleString('id-ID')} km
                                                    </p>
                                                </div>
                                                
                                                <div className="data-box data-box-orange">
                                                    <p className="jarvis-text" style={{fontSize: '12px', opacity: 0.7}}>NEXT SERVICE</p>
                                                    <p className="jarvis-text" style={{fontSize: '18px', fontWeight: 700, color: '#ff9500'}}>
                                                        {s.kmNextService.toLocaleString('id-ID')} km
                                                    </p>
                                                </div>
                                                
                                                {s.catatan && (
                                                    <div style={{marginTop: '15px', padding: '10px', background: 'rgba(0, 229, 255, 0.05)', borderLeft: '2px solid #00e5ff'}}>
                                                        <p className="jarvis-text" style={{fontSize: '12px', opacity: 0.7}}>NOTES</p>
                                                        <p className="jarvis-text" style={{fontSize: '14px'}}>{s.catatan}</p>
                                                    </div>
                                                )}
                                                
                                                
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Footer */}
                    <footer style={{marginTop: '40px', padding: '20px', textAlign: 'center', borderTop: '1px solid rgba(0, 229, 255, 0.2)'}}>
                        <p className="jarvis-text" style={{fontSize: '12px', opacity: 0.5}}>
                            <span className="status-dot status-online"></span>
                            JARVIS MOTOR SERVICE ENGINEERING SYSTEM | POWERED BY FIREBASE
                        </p>
                    </footer>
                </div>
            );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
